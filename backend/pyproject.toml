[project]
name = "ticket-resolver-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.7.0",
    "docling>=2.150.0",
    "google-cloud-storage>=3.17.1",
    "litellm>=1.108.5",
    "onnxruntime>=1.31.1",  # RapidOCR engine used by Docling for scanned PDFs
    "pgvector>=0.5.1",
    "python-multipart>=0.0.33",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sentry-sdk>=3.0.0",
    "sqlalchemy[asyncio]>=2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

# Docling needs torch; use the CPU-only wheels (the default ones pull in
# several GB of CUDA libraries we never use).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"] # assert is fine in tests
# "›" separates heading paths in context headers (SPEC §7); "–" in prose ranges.
allowed-confusables = ["›", "–"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fake tokens/passwords in tests
"alembic/versions/**" = ["S608"] # migrations interpolate module constants (role names), never input

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "workers"]

[[tool.mypy.overrides]]
# Celery ships no type information.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["workers.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs a real Postgres (DATABASE_URL and APP_DATABASE_URL)",
    "live: calls real external providers; never runs by default",
    "docling_models: needs Docling's downloaded layout/OCR models (DOCLING_MODELS=1)",
]
addopts = "-ra"
