name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; every push to main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      # Same image as compose.yaml. Credentials are throwaway: this container
      # exists only for the job, so they are not secrets.
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: ticket_resolver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner -d ticket_resolver"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      ENVIRONMENT: test
      AUTH_PROVIDER: fake
      DATABASE_URL: postgresql://owner:ci_owner_password@localhost:5432/ticket_resolver
      APP_DATABASE_URL: postgresql://app_user:ci_app_user_password@localhost:5432/ticket_resolver
      # Missing DB config must fail the build, never skip the RLS suite.
      REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --frozen

      - name: Ruff
        run: |
          uv run --frozen ruff check . ../seed
          uv run --frozen ruff format --check . ../seed

      - name: Mypy
        run: uv run --frozen mypy app workers

      - name: Migrations (upgrade, full downgrade, upgrade)
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head

      - name: Tests (unit, RLS, catalog, cross-tenant)
        run: uv run --frozen pytest -rs

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # No Clerk keys in CI: the app builds with the fake dev sign-in.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        env:
          APP_DB_PASSWORD: ci_only
        run: docker compose --profile app config --quiet

      - name: Build API image
        run: docker build -t ticket-resolver-api:ci backend

      - name: Build web image
        run: docker build -t ticket-resolver-web:ci web
