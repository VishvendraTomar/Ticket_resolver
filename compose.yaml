# Local development stack, from the repo root.
#
#   docker compose up -d                        # postgres + redis (dev servers run natively)
#   docker compose --profile app up -d --build  # + migrate, api, web in containers
#
# Postgres superuser = the owner role (DATABASE_URL). The app role `app_user`
# (NOBYPASSRLS) is created by the migration, never here. Only the one-shot
# `migrate` service gets owner credentials; `api` gets app_user only (ADR-0002).
# Further services arrive in the milestone that first needs them (PLAN.md).

name: ticket-resolver

x-db-name: &db_name ${POSTGRES_DB:-ticket_resolver}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owner_local_only}
      POSTGRES_DB: *db_name
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Cloud Storage emulator (PLAN M2): STORAGE_PROVIDER=gcs + STORAGE_EMULATOR_HOST.
  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://localhost:4443",
              "-backend", "memory"]
    ports:
      - "127.0.0.1:4443:4443"

  migrate:
    profiles: [app]
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-owner}:${POSTGRES_PASSWORD:-owner_local_only}@postgres:5432/${POSTGRES_DB:-ticket_resolver}
      APP_DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ticket_resolver}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: ./backend
    # Explicit list, no env_file: the owner DATABASE_URL must never reach the app.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ticket_resolver}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-fake}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ingestion worker (ADR-0007): same image as the API; Docling runs here, not in the API.
  worker:
    profiles: [app]
    build: ./backend
    command: ["celery", "-A", "workers.celery_app", "worker", "-Q", "ingestion,maintenance",
              "-c", "2", "--loglevel", "INFO"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ticket_resolver}
      CELERY_BROKER_URL: redis://redis:6379/0
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      PARSER_PROVIDER: ${PARSER_PROVIDER:-docling}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      EMBEDDINGS_LOCATION: ${EMBEDDINGS_LOCATION:-europe-west4}
      LLM_SMALL_MODEL: ${LLM_SMALL_MODEL:-vertex_ai/gemini-3.5-flash}
      LLM_LOCATION: ${LLM_LOCATION:-europe-west3}
      HF_HOME: /data/hf-cache  # Docling's models, downloaded once
    volumes:
      - uploads:/data/uploads
      - hfcache:/data/hf-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ./web
      args:
        # The browser calls the API on the host's published port.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  hfcache:
